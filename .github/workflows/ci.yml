# IaC gate: fmt, validate, tflint, docs-drift, contract. The plan job runs
# only for the estate owner with secrets; everything else runs cred-free.
# Apply is ALWAYS human-gated (GH environment approval) — never CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
      - run: make ci

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - run: curl -sSfL https://terraform-docs.io/dl/v0.19.0/terraform-docs-v0.19.0-linux-amd64.tar.gz | tar xz -C /usr/local/bin terraform-docs
      - run: make docs && git diff --exit-code -- modules/*/README.md

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-contract.sh

  plan:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'WyattAu' }}
    environment: dev-apply
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - name: install conftest (pinned)
        run: curl -sSfL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin conftest
      - run: ./scripts/plan.sh dev
        env:
          # wire real provider creds via GH environment secrets
          TF_VAR_region: ${{ vars.TF_VAR_region }}

  # Loop 2: performance budget - blocking since it stayed green for a full
  # loop (LOOP.md graduation policy). Same scripts/ command a developer runs
  # locally; never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
      - run: make bench

  # Loop 3: determinism verification. This template's script runs in report mode
  # because two identical `tofu plan` runs were measured to produce different
  # binaries (per-run serial in the plan container) - the reason and the
  # follow-up live in the determinism ADR. Same scripts/ command a developer
  # runs locally.
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - run: make repro

  # Phase 1 of copier adoption (ADR-0001, engineering-standards): copying this
  # template with default answers must reproduce the tracked content exactly.
  # Any drift is a template bug — the update channel depends on this invariant.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install copier
      - name: byte-identical scaffold check
        run: |
          mkdir -p "$RUNNER_TEMP/tracked"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked" -f -
          copier copy --defaults "$RUNNER_TEMP/tracked" "$RUNNER_TEMP/sc"
          diff -r --exclude=.copier-answers.yml --exclude=.git --exclude=copier.yml \
            "$RUNNER_TEMP/sc" "$RUNNER_TEMP/tracked"
